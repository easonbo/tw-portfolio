name: 更新台股收盤資料

on:
  schedule:
    # 台灣時間 週一~五 15:17、18:47（UTC+8），第二次補抓櫃買較晚公布的資料
    - cron: "17 7 * * 1-5"
    - cron: "47 10 * * 1-5"
  workflow_dispatch:
    inputs:
      start:
        description: "回補起日 YYYY-MM-DD（留空 = 從上次最後一天接著抓）"
        required: false
      end:
        description: "回補迄日 YYYY-MM-DD（留空 = 今天）"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 抓取資料
        env:
          MAX_MINUTES: "100"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          if [ -n "${{ github.event.inputs.end }}" ]; then ARGS="$ARGS --end ${{ github.event.inputs.end }}"; fi
          python scripts/update.py $ARGS

      - name: 提交更新
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F)"
            git pull --rebase origin main
            git push
          fi
